name: Gráficos y tarjetas

on:
  schedule:
    - cron: "30 8 * * *"   # todos los días, 03:30 hora de Ecuador
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/langmix.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Radar de habilidades (edita assets/skills.json)
      - name: Radar de habilidades
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      # Radar de lenguajes (edita assets/langmix.json)
      - name: Radar de lenguajes
        run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs --values

      # Tarjetas propias de estadísticas y lenguajes
      - name: Tarjetas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py --user "${{ github.repository_owner }}" --out assets

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/card-*.svg
          git diff --staged --quiet || git commit -m "chore: actualizar gráficos y tarjetas"
          git push
